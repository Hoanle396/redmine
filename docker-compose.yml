services:
  db-redmine:
    image: postgres:16-alpine
    container_name: db-redmine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-redmine}
      POSTGRES_USER: ${POSTGRES_USER:-redmine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redmine_secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redmine} -d ${POSTGRES_DB:-redmine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redmine-app:
    image: redmine:latest
    container_name: redmine-app
    restart: unless-stopped
    depends_on:
      db-redmine:
        condition: service_healthy
    ports:
      - "${REDMINE_PORT:-3000}:3000"
    environment:
      REDMINE_DB_POSTGRES: db-redmine
      REDMINE_DB_PORT: 5432
      REDMINE_DB_DATABASE: ${POSTGRES_DB:-redmine}
      REDMINE_DB_USERNAME: ${POSTGRES_USER:-redmine}
      REDMINE_DB_PASSWORD: ${POSTGRES_PASSWORD:-redmine_secret}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:-please_change_this_to_a_long_random_string}
      REDMINE_PLUGINS_MIGRATE: "true"
    volumes:
      - redmine_files:/usr/src/redmine/files
      - ./plugins:/usr/src/redmine/plugins
      - ./themes:/usr/src/redmine/public/themes

volumes:
  db_data:
  redmine_files:
